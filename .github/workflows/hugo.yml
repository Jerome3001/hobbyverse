# Déploiement de Hobbyverse sur GitHub Pages.
# Se déclenche à chaque envoi sur la branche main, ou à la main depuis l'onglet Actions.
# Prérequis dans le dépôt : Settings > Pages > Source = « GitHub Actions ».

name: Déployer Hobbyverse sur GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.160.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Hugo (version fixée, somme de contrôle vérifiée)
        run: |
          BASE="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          DEB="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget -q -O "${RUNNER_TEMP}/${DEB}" "${BASE}/${DEB}"
          wget -q -O "${RUNNER_TEMP}/checksums.txt" "${BASE}/hugo_${HUGO_VERSION}_checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " ${DEB}\$" checksums.txt | sha256sum -c -
          sudo dpkg -i "${DEB}"

      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Construire le site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "https://hobbyverse.fr/"

      - name: Contrôler la sortie
        run: |
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          grep -q "https://hobbyverse.fr/" public/sitemap.xml || { echo "Le sitemap n'utilise pas le domaine hobbyverse.fr"; exit 1; }
          ! grep -rl "github.io" public || { echo "Une adresse github.io est restée dans le site"; exit 1; }
          ! grep -rl "localhost" public || { echo "Une adresse localhost est restée dans le site"; exit 1; }

      - name: Envoyer l'artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
