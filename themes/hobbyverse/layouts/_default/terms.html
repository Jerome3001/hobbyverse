{{ define "main" }}
<section class="page-head">
    <div class="wrap">
        <h1>{{ .Title }}</h1>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </div>
</section>
<div class="wrap terms">
    <div class="terms-grid">
        {{ range .Data.Terms.Alphabetical }}
        <a href="{{ .Page.RelPermalink }}" class="term-card term-{{ .Page.Title | urlize }}">
            <h2>{{ .Page.Title }}</h2>
            <p>{{ .Page.Params.tagline }}</p>
            <span class="tile-foot">{{ .Count }} guide{{ if gt .Count 1 }}s{{ end }} <b>→</b></span>
        </a>
        {{ end }}
    </div>
</div>
{{ end }}
